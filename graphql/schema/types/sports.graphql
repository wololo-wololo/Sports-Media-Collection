"Kind of session within an event"
enum SessionType {
  PRACTICE_1
  PRACTICE_2
  PRACTICE_3
  PRACTICE
  QUALIFYING
  SPRINT_QUALIFYING
  SPRINT
  WARM_UP
  RACE
  MATCH
  OTHER
}

"Which picture a recording shows"
enum FeedType {
  WORLD_FEED
  ONBOARD
  PIT_LANE
  DATA_CHANNEL
  DRIVER_TRACKER
  "Studio programming such as build-up or analysis shows"
  STUDIO
  HIGHLIGHTS
  DOCUMENTARY
  OTHER
}

"Where a recording came from"
enum RecordingSource {
  TV
  STREAMING
  DVD
  BLU_RAY
  VHS
  WEB
  OTHER
}

"Whether a recording covers its whole session"
enum Completeness {
  COMPLETE
  PARTIAL
}

"A competition such as Formula 1 or MotoGP"
type Series {
  id: ID!
  name: String!
  short_name: String
  "Sport the series belongs to, e.g. Motorsport"
  sport: String!
  "Display colour in hex notation"
  color: String
  "Where calendar data is synced from, e.g. jolpica-f1"
  data_source: String
  "Seasons that have events, newest first"
  seasons: [Int!]!
  event_count: Int!
  "Recordings linked to an event of this series"
  scene_count: Int!
  created_at: Time!
  updated_at: Time!
}

"A meeting within a series season, such as a Grand Prix"
type Event {
  id: ID!
  series: Series!
  season: Int!
  round: Int
  name: String!
  circuit: String
  location: String
  country: String
  "First day of the event, YYYY-MM-DD"
  start_date: String
  "Last day of the event, YYYY-MM-DD"
  end_date: String
  "Identifier used by the series data source"
  external_id: String
  sessions: [EventSession!]!
  "Recordings of this event, including session recordings"
  scenes: [Scene!]!
  scene_count: Int!
  created_at: Time!
  updated_at: Time!
}

"A session of an event, such as qualifying or the race"
type EventSession {
  id: ID!
  event: Event!
  session_type: SessionType!
  "Display name overriding the session type label"
  name: String
  start_time: Time
  "Winner of the session; the pole sitter for qualifying"
  winner: String
  scenes: [Scene!]!
  scene_count: Int!
  created_at: Time!
  updated_at: Time!
}

input SeriesCreateInput {
  name: String!
  short_name: String
  sport: String
  color: String
  data_source: String
}

input SeriesUpdateInput {
  id: ID!
  name: String
  short_name: String
  sport: String
  color: String
  data_source: String
}

input EventCreateInput {
  series_id: ID!
  season: Int!
  round: Int
  name: String!
  circuit: String
  location: String
  country: String
  start_date: String
  end_date: String
  external_id: String
}

input EventUpdateInput {
  id: ID!
  series_id: ID
  season: Int
  round: Int
  name: String
  circuit: String
  location: String
  country: String
  start_date: String
  end_date: String
  external_id: String
}

input EventSessionCreateInput {
  event_id: ID!
  session_type: SessionType!
  name: String
  start_time: Time
  winner: String
}

input EventSessionUpdateInput {
  id: ID!
  event_id: ID
  session_type: SessionType
  name: String
  start_time: Time
  winner: String
}

input SessionTypeCriterionInput {
  value: [SessionType!]
  modifier: CriterionModifier!
}

input FeedTypeCriterionInput {
  value: [FeedType!]
  modifier: CriterionModifier!
}

input RecordingSourceCriterionInput {
  value: [RecordingSource!]
  modifier: CriterionModifier!
}

input CompletenessCriterionInput {
  value: [Completeness!]
  modifier: CriterionModifier!
}

input SyncSeriesCalendarInput {
  "Seasons to sync; all seasons when omitted or empty"
  seasons: [Int!]
}

"How sure the import is about a suggested event"
enum ImportConfidence {
  "Event and session read from the name and confirmed by the calendar"
  HIGH
  "Event is clear, some values were guessed"
  MEDIUM
  "Several events fit; one has to be chosen"
  LOW
  "No event found"
  NONE
}

"One suggested value, for display"
type ImportField {
  name: String!
  value: String!
  "Inferred rather than read from the name"
  guessed: Boolean!
  "filename, folder, rule or guess"
  origin: String!
}

"What the import proposes for a recording"
type ImportSuggestion {
  scene: Scene!
  path: String!
  confidence: ImportConfidence!
  series: Series
  event: Event
  session: EventSession
  "Other events that fit, best first"
  alternatives: [Event!]!
  "Existing broadcaster"
  studio: Studio
  "Broadcaster name; created on accept when no studio exists"
  broadcaster_name: String
  language: String
  feed_type: FeedType
  feed_subject: String
  source: RecordingSource
  part: Int
  fields: [ImportField!]!
  notes: [String!]!
}

type FindImportSuggestionsResultType {
  count: Int!
  suggestions: [ImportSuggestion!]!
}

input ImportSuggestionsInput {
  "Limit to these recordings; otherwise all recordings without an event"
  scene_ids: [ID!]
  "Include recordings dismissed from the review"
  include_dismissed: Boolean
  "List only recordings dismissed from the review"
  dismissed_only: Boolean
  "1-based page, default 1"
  page: Int
  "Default 25, at most 200"
  per_page: Int
}

input ImportAcceptInput {
  scene_id: ID!
  "Use this event instead of the suggested one"
  event_id: ID
}

input ImportAcceptAllInput {
  "Default HIGH"
  min_confidence: ImportConfidence
  "Limit to these recordings; otherwise all recordings without an event"
  scene_ids: [ID!]
}

input ImportDismissInput {
  scene_ids: [ID!]!
  "false brings recordings back into the review"
  dismissed: Boolean!
}

"Recordings of one session"
type SessionCoverage {
  session: EventSession!
  recordings: Int!
  "Recordings marked as incomplete"
  partial: Int!
}

"Recordings of one event, by session"
type EventCoverage {
  event: Event!
  "Every session of the event, in weekend order"
  sessions: [SessionCoverage!]!
  "Recordings of the event that cover no single session"
  extras: Int!
  recordings: Int!
}

"Calendar and recording totals of one season"
type SeasonCoverage {
  season: Int!
  events: Int!
  sessions: Int!
  "Sessions with at least one recording"
  covered_sessions: Int!
  recordings: Int!
}
